<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        #stand {
            height: 60px;
            width: 110px;
            border: 2px solid black;
            cursor: pointer;
        }

        #results {
            height: 300px;
            width: 200px;
            border: 3px solid greenyellow;
            display: none;
            
        }
    </style>
    <title>Document</title>
</head>

<body>
    <button id="stand" onclick="display()">Tble 2</button>
    <br>
    <div id="results">
        <h2>Multiplication table 2</h2>
        <ul>
            <li>2* 1=2</li>
            <li>2* 2=4</li>
            <li>2* 3=6</li>
            <li> 2* 4=8</li>
        </ul>
    </div>
    <script>
        const btn = document.getElementById("stand");
        const results = document.getElementById("results");

        function display() {
            results.style.display = 'flex';
        }
    </script>
</body>

</html>
