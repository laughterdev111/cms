<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff Login | Rwebeya Clinic</title><link rel="stylesheet" href="../css/style.css"></head>
<body class="center-page"><main class="login-card"><div class="brand-mark">RC</div><p class="eyebrow">RWEBEYA CLINIC</p><h1>Staff sign in</h1>
<p class="muted">Use your registered staff email and password.</p>
<form id="loginForm"><label>Email address<input type="email" id="email" required autocomplete="username"></label>
<label>Password<input type="password" id="password" required autocomplete="current-password"></label>
<button class="btn" type="submit">Sign in</button><p id="message" class="notice" role="status"></p></form>
</main><script src="../js/app.js"></script></body></html>
