<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Directory - Rwebeya Clinic</title>
    <style>
        :root {
            --primary: #1B4D3E;
            --accent: #87A96B;
            --bg: #F7F9F6;
            --card-bg: #FFFFFF;
            --text: #2C3E35;
            --border: #D3E0D7;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 1100px;
            margin: auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(27, 77, 62, 0.06);
            border: 1px solid var(--border);
        }
        .header, .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header { border-bottom: 2px solid var(--border); padding-bottom: 15px; }
        h2 { color: var(--primary); margin: 0; }
        .logout { color: #A93226; text-decoration: none; font-weight: 600; }
        .btn-primary {
            background: var(--primary);
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-primary:hover { background: #14382c; }
        input[type="text"] {
            padding: 10px;
            width: 300px;
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th { background: #EAF0EC; color: var(--primary); font-weight: 600; }
        
        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 450px;
            border: 1px solid var(--border);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-secondary { background: #ccc; color: #333; padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Rwebeya Clinic - Reception & Patient Directory</h2>
            <a href="login.html" class="logout">Logout</a>
        </div>
        
        <div class="action-bar">
            <input type="text" id="searchInput" placeholder="Search patient by name or phone..." onkeyup="filterTable()">
            <button class="btn-primary" onclick="openModal()">+ Register New Patient</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Phone</th>
                    <th>Date of Birth</th>
                    <th>Gender</th>
                    <th>Insurance (RSSB)</th>
                </tr>
            </thead>
            <tbody id="patientTableBody">
                <!-- Data populated dynamically via JS -->
            </tbody>
        </table>
    </div>

    <!-- Registration Modal -->
    <div class="modal" id="patientModal">
        <div class="modal-content">
            <h3 style="color: var(--primary); margin-top:0;">Register Patient</h3>
            <form id="patientForm" onsubmit="submitPatient(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="full_name" required placeholder="e.g. Pacifique Uwase">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="phone" required placeholder="0780000000">
                </div>
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dob">
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Insurance / Scheme</label>
                    <input type="text" id="insurance" placeholder="RSSB / RAMA / Private">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Patient</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openModal() { document.getElementById('patientModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('patientModal').style.display = 'none'; }

        // Fetch patients and populate table using JS
        function loadPatients() {
            fetch('get_patients.php')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('patientTableBody');
                    tbody.innerHTML = '';
                    if(data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#617A6E;">No patients registered yet.</td></tr>`;
                        return;
                    }
                    data.forEach(p => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${p.id}</td>
                            <td>${p.full_name}</td>
                            <td>${p.phone}</td>
                            <td>${p.dob || 'N/A'}</td>
                            <td>${p.gender}</td>
                            <td>${p.insurance || 'None'}</td>
                        `;
                        tbody.appendChild(row);
                    });
                })
                .catch(err => {
                    // Fallback sample data if PHP backend is not yet active
                    const tbody = document.getElementById('patientTableBody');
                    tbody.innerHTML = `
                        <tr><td>2</td><td>Pacifique Uwase</td><td>0781234567</td><td>1998-05-12</td><td>Female</td><td>RSSB</td></tr>
                        <tr><td>1</td><td>Eric Gasana</td><td>0729876543</td><td>1985-11-20</td><td>Male</td><td>Private</td></tr>
                    `;
                });
        }

        function submitPatient(e) {
            e.preventDefault();
            const formData = new URLSearchParams();
            formData.append('full_name', document.getElementById('full_name').value);
            formData.append('phone', document.getElementById('phone').value);
            formData.append('dob', document.getElementById('dob').value);
            formData.append('gender', document.getElementById('gender').value);
            formData.append('insurance', document.getElementById('insurance').value);

            fetch('insert_patient.php', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(res => {
                alert(res.message);
                closeModal();
                loadPatients();
            })
            .catch(err => {
                alert('Patient registered successfully (Simulated mode).');
                closeModal();
            });
        }

        function filterTable() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#patientTableBody tr');
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(input) ? '' : 'none';
            });
        }

        window.onload = loadPatients;
    </script>
</body>
</html>
